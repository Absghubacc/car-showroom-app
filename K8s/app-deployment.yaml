apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-showroom-app
  namespace: car-showroom
  labels:
    app: car-showroom-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-showroom-app
  template:
    metadata:
      labels:
        app: car-showroom-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: car-showroom-app
          image: DOCKERHUB_USERNAME/car-showroom-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb-service.car-showroom.svc.cluster.local:27017/"
---
apiVersion: v1
kind: Service
metadata:
  name: car-showroom-service
  namespace: car-showroom
  labels:
    app: car-showroom-app
spec:
  type: NodePort
  selector:
    app: car-showroom-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500